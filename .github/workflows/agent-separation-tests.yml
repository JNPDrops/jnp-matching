name: Agent separation tests
on:
  push:
    branches: [refactor/agent-separation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jnp_test_agents
          POSTGRES_USER: test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d jnp_test_agents"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JNP_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 dbname=jnp_test_agents user=test password=synthetic-ci-only
      DATABASE_URL: ''
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m unittest discover -s tests -q
      - run: python -m unittest operations.test_automatic_debtor_routing operations.test_routing_transport operations.test_customer_only_routing operations.test_source_order_policy operations.test_allocation_connection -q
      - run: python -m pytest operations/test_woo_iban_rules.py operations/test_tax_ledger_routing.py operations/test_tax_reference.py operations/test_tax_allocation.py operations/test_allocation_maintenance.py operations/test_bank_resolution.py -q
