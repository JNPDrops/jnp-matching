<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f6f9,#111720);--surface:light-dark(#fff,#1a2230);--ink:light-dark(#172435,#edf2f8);--sub:light-dark(#566578,#afbdd0);--line:light-dark(#dce3ec,#354256);--soft:light-dark(#ecf1f7,#253044);--brand:light-dark(#154da1,#aacaff);--accent:light-dark(#e8f0ff,#283d59);--green:light-dark(#13674e,#9be3c8);--amber:light-dark(#855000,#ffd38f);--warn:light-dark(#fff2dc,#44341d)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:215px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:27px}.logo{display:flex;align-items:center;gap:10px;padding:0 8px}.mark{background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:8px;font-weight:650;letter-spacing:-1px}.logo b{font-size:17px}.caption{font-size:12px;color:var(--sub)}nav{display:grid;gap:5px}.nav{background:none;border:0;color:var(--sub);text-align:left;border-radius:7px;padding:11px 13px}.nav.active{background:var(--accent);color:var(--brand);font-weight:600}.sidebar-bottom{margin-top:auto;padding:14px 8px;color:var(--sub);font-size:12px}.main{min-width:0}.topbar{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--line)}.topbar label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:9px}.topbar select{max-width:320px}.badge{font-size:12px;background:var(--soft);color:var(--sub);padding:4px 9px;border-radius:5px}.demo{border-bottom:1px solid var(--line);background:var(--warn);color:var(--amber);font-size:12px;padding:8px 28px}.content{padding:26px 28px;max-width:1500px;margin:auto}h1{font-size:25px;letter-spacing:-.6px;margin:0}h2{font-size:18px;letter-spacing:-.3px;margin:0}h3{font-size:14px;margin:0 0 10px}.subtitle{color:var(--sub);margin:5px 0 23px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:17px}input,select,textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 10px}input[type=search]{flex:1;min-width:180px}textarea{width:100%;resize:vertical;min-height:64px}.status-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:17px 0}.status-tabs button{background:none;border:1px solid transparent;color:var(--sub);border-radius:6px;padding:7px 11px}.status-tabs button.active{background:var(--surface);border-color:var(--line);color:var(--ink)}.status-tabs span{display:inline-block;margin-left:5px;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(380px,1.2fr) minmax(315px,1fr);gap:18px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}.list-title{padding:13px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--sub);font-size:12px}.case{display:block;width:100%;text-align:left;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--line);padding:16px 17px;border-left:3px solid transparent}.case:last-child{border-bottom:0}.case.active{background:var(--accent);border-left-color:var(--brand)}.case:hover{background:var(--soft)}.case-head{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:5px}.case-title{font-weight:600}.amount{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}.case-meta{color:var(--sub);font-size:12px}.case-foot{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:12px;color:var(--sub)}.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--soft);color:var(--sub)}.pill.wait{background:var(--warn);color:var(--amber)}.pill.ready{color:var(--green)}.detail-head{padding:20px;border-bottom:1px solid var(--line)}.detail-head .caption{margin:6px 0}.detail-body{padding:20px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px}.facts dt{font-size:12px;color:var(--sub)}.facts dd{margin:3px 0 0;font-weight:500}.evidence{border-left:3px solid var(--line);padding:0 0 0 13px;margin:12px 0 22px;color:var(--sub)}.field{display:grid;gap:7px;margin:0 0 16px}.field>label{font-size:12px;color:var(--sub)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;border-radius:6px;font-weight:500}.primary{background:var(--brand);border-color:var(--brand);color:light-dark(#fff,#142033)}.quiet{background:transparent}.muted{color:var(--sub)}.empty{padding:40px 20px;text-align:center;color:var(--sub)}.table-wrap{overflow:auto}.grid-table{width:100%;border-collapse:collapse}.grid-table th,.grid-table td{padding:14px 17px;text-align:left;border-bottom:1px solid var(--line)}.grid-table th{font-size:12px;color:var(--sub);font-weight:500;white-space:nowrap}.grid-table tr:last-child td{border-bottom:0}.grid-table td small{display:block;color:var(--sub);font-size:12px;margin-top:3px}.note{padding:16px 18px;background:var(--soft);border-radius:7px;margin-top:18px;color:var(--sub)}.layout-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.plan{padding:22px}.plan ol,.plan ul{padding-left:21px;margin-bottom:0}.plan li{margin:9px 0}.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.flow span{border:1px solid var(--line);padding:6px 10px;border-radius:5px;font-size:12px}.flow b{font-weight:400;align-self:center;color:var(--sub)}dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:25px;max-width:470px;width:calc(100% - 32px)}dialog::backdrop{background:#0e18296e}.modal-summary{margin:20px 0;padding:15px;background:var(--soft);border-radius:6px}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--surface);padding:13px 19px;border-radius:8px;max-width:380px;z-index:5}.toolbar-end{margin-left:auto}.footnote{font-size:12px;color:var(--sub);margin-top:18px}.arch-title{margin-bottom:15px}.admin-pill{font-size:12px;color:var(--brand)}
@media(max-width:1050px){.app{grid-template-columns:175px minmax(0,1fr)}.workspace{grid-template-columns:1fr}.content{padding:21px}.topbar{padding:14px 21px}.layout-grid{grid-template-columns:1fr}}
@media(max-width:650px){.app{display:block}.sidebar{padding:12px 16px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.sidebar-bottom{display:none}nav{display:flex;overflow:auto}.nav{white-space:nowrap;padding:8px}.logo b{font-size:15px}.topbar{align-items:start;flex-direction:column;gap:7px;padding:12px 17px}.topbar label{width:100%;flex-wrap:wrap}.topbar select{max-width:100%;width:100%}.demo{padding:8px 17px}.content{padding:18px 14px}h1{font-size:22px}.toolbar select{flex:1;min-width:120px}.workspace{display:block}.detail{margin-top:18px}.facts{gap:12px}.grid-table th,.grid-table td{padding:12px}.case{padding:14px 12px}}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="logo"><span class="mark">JNP</span><div><b>Operations</b><div class="caption">Administratieplatform</div></div></div>
  <nav aria-label="Hoofdnavigatie">
   <button class="nav active" data-view="work">Werklijst</button>
   <button class="nav" data-view="journals">Bankboeken</button>
   <button class="nav" data-view="admins">Administraties</button>
   <button class="nav" data-view="workers">Verwerking</button>
   <button class="nav" data-view="design">Schaalbaar ontwerp</button>
  </nav>
  <div class="sidebar-bottom">Eén werkplek voor alle vragen.<br>Toegang per administratie.</div>
 </aside>
 <main class="main">
  <header class="topbar"><label for="admin">Administratie<select id="admin"><option value="all">Alle toegewezen administraties</option></select></label><div><span class="badge" id="signed-in">Aanmelding controleren…</span> <button class="button" id="logout">Uitloggen</button></div></header>
  <div class="demo">Open vragen uit de agents, met bronbewijs en vervolgstap. Een besluit vastleggen voert geen boeking in Exact uit.</div>
  <section class="content" id="screen" aria-live="polite"></section>
 </main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const admins={}, results={}, drafts={};
let auth=null, cases=[], view='work', selected=null, tab='open', search='', psp='all', kind='all', group='all', journal='all', page=0, loading=false, requestNumber=0;
const labels={open:'Te behandelen',waiting:'Wacht op informatie',decided:'Besluit klaar',resolved:'Uitvoering bevestigd'};
const groups={purchase_missing:'Ontbrekende inkoopfacturen',purchase_review:'Inkoopfactuur of bon controleren',sales_waiting:'Webshoporder wacht op factuurimport',sales_review:'Verkoopfactuur / order controleren',other:'Overige vragen'};
const sourceLabels={ready:'Aangesloten',unavailable:'Nog niet beschikbaar',not_scanned:'Nog niet beoordeeld',error:'Ophalen mislukt'};
const stamp=v=>{const d=new Date(v);return v&&!Number.isNaN(d.valueOf())?new Intl.DateTimeFormat('nl-NL',{dateStyle:'short',timeStyle:'short',timeZone:'Europe/Amsterdam'}).format(d):'Niet bekend'};
const amount=(n,c)=>{if(n===null||n===undefined||n==='')return 'Niet vastgesteld';const v=Number(n);if(!Number.isFinite(v))return 'Niet vastgesteld';try{return c?new Intl.NumberFormat('nl-NL',{style:'currency',currency:c}).format(v):new Intl.NumberFormat('nl-NL',{maximumFractionDigits:2}).format(v)+' (valuta onbekend)'}catch{return String(n)+' '+(c||'')}};
const scoped=()=>cases.filter(c=>$('admin').value==='all'||c.division===$('admin').value);
const selectedDivisions=()=>Object.keys(admins).filter(id=>$('admin').value==='all'||$('admin').value===id);
const journalKey=c=>c.journal?c.division+':'+c.journal:'unknown';
const journalLabel=c=>c.journal?c.journal+' · '+(c.journal_name||'Bankboek')+' · '+(admins[c.division]?.name||c.division):'Bankboek onbekend';
const key=c=>c.division+':'+c.id;
function notify(message){$('toast').textContent=message;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,6000)}
function filters(){return scoped().filter(c=>c.status===tab&&(journal==='all'||journalKey(c)===journal)&&(group==='all'||(c.question_group||'other')===group)&&(psp==='all'||c.psp===psp)&&(kind==='all'||c.category===kind)&&[c.reference,c.entry_number,c.invoice_number,c.transaction_id,c.title,c.psp,c.reason,admins[c.division]?.name].join(' ').toLowerCase().includes(search.toLowerCase()))}
function sourcePanel(){return selectedDivisions().map(id=>{const r=results[id];if(!r)return '<p class="muted">'+esc(admins[id].name)+' · gegevens laden…</p>';if(r.load_error)return '<p class="muted">'+esc(admins[id].name)+' · Ophalen mislukt. Ververs om opnieuw te proberen; de lijst is onvolledig.</p>';return '<div style="margin:8px 0"><b>'+esc(admins[id].name)+'</b><div class="flow">'+(r.sources||[]).map(x=>'<span>'+esc(x.name)+' · '+esc(sourceLabels[x.status]||x.status)+'<br><small>'+esc(stamp(x.observed_at))+(x.stale?' · bron ouder dan 2 uur of zonder tijdstip':'')+'</small></span>').join('')+'</div>'+(!r.connected?'<p>Deze administratie heeft nog geen aangesloten bron.</p>':'')+(!r.complete?'<p class="caption">Niet alle bronnen zijn beschikbaar. Een lege lijst bewijst niet dat alles is afgehandeld.</p>':'')+(!r.workflow_ready?'<p class="caption">Opgeslagen besluiten zijn momenteel niet beschikbaar; behandelen is geblokkeerd.</p>':'')+'</div>'}).join('')}
function work(){
 const counts=scoped().reduce((a,c)=>(a[c.status]=(a[c.status]||0)+1,a),{});
 const providers=[...new Set(scoped().map(c=>c.psp).filter(Boolean))].sort();
 const journals=[...new Map(scoped().map(c=>[journalKey(c),journalLabel(c)])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
 const categories=[...new Map(scoped().map(c=>[c.category,c.title])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
 $('screen').innerHTML='<h1>Wat heeft jouw aandacht nodig?</h1><p class="subtitle">Echte vragen uit de agents. Bekijk het bronbewijs en leg vast wat nodig is voor de volgende stap.</p><details class="panel" style="padding:14px 18px;margin-bottom:18px"><summary>Bronnen en actualiteit</summary>'+sourcePanel()+'</details><div class="status-tabs">'+Object.entries(labels).map(([s,label])=>'<button data-tab="'+s+'" class="'+(tab===s?'active':'')+'">'+label+' <span>'+(counts[s]||0)+'</span></button>').join('')+'</div><div class="toolbar"><input type="search" id="search" aria-label="Zoeken in de werklijst" placeholder="Zoek order, boekingsnummer, betaling of vraag…" value="'+esc(search)+'"><select id="provider" aria-label="Betaalstroom"><option value="all">Alle betaalstromen</option>'+providers.map(p=>'<option value="'+esc(p)+'" '+(psp===p?'selected':'')+'>'+esc(p)+'</option>').join('')+'</select><select id="journal" aria-label="Bankboek"><option value="all">Alle bankboeken</option>'+journals.map(([v,l])=>'<option value="'+esc(v)+'" '+(journal===v?'selected':'')+'>'+esc(l)+' ('+scoped().filter(c=>journalKey(c)===v&&c.status===tab).length+')</option>').join('')+'</select><select id="group" aria-label="Factuurcategorie"><option value="all">Alle factuurcategorieën</option>'+Object.entries(groups).map(([v,l])=>'<option value="'+v+'" '+(group===v?'selected':'')+'>'+esc(l)+' ('+scoped().filter(c=>(c.question_group||'other')===v&&c.status===tab).length+')</option>').join('')+'</select><select id="kind" aria-label="Soort vraag"><option value="all">Alle soorten vragen</option>'+categories.map(([v,l])=>'<option value="'+esc(v)+'" '+(kind===v?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select><button class="button" id="refresh" '+(loading?'disabled':'')+'>'+(loading?'Verversen…':'Verversen')+'</button></div><div class="workspace"><div class="panel"><div class="list-title"><span id="list-count"></span><span>Bedrag = oorspronkelijke betaling</span></div><div id="case-list"></div><div id="pagination" class="actions" style="padding:12px;margin:0"></div></div><section class="panel detail" id="detail" aria-label="Geselecteerde vraag"></section></div><p class="footnote">Restbedragen worden alleen getoond als ze uit Exact zijn vastgesteld. Bedragen worden niet over valuta of verschillende soorten posten opgeteld.</p>';
 $('search').oninput=e=>{search=e.target.value;page=0;renderList()};$('provider').onchange=e=>{psp=e.target.value;page=0;renderList()};$('journal').onchange=e=>{journal=e.target.value;page=0;renderList()};$('group').onchange=e=>{group=e.target.value;kind='all';page=0;work()};$('kind').onchange=e=>{kind=e.target.value;page=0;renderList()};$('refresh').onclick=()=>loadWork();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;page=0;work()});renderList();
}
function renderList(){
 const rows=filters();page=Math.max(0,Math.min(page,Math.ceil(rows.length/100)-1));const list=rows.slice(page*100,(page+1)*100);
 if(!list.some(c=>key(c)===selected))selected=list[0]?key(list[0]):null;
 $('list-count').textContent=rows.length+' '+(rows.length===1?'vraag':'vragen');
 $('case-list').innerHTML=list.map(c=>'<button class="case '+(key(c)===selected?'active':'')+'" data-case="'+esc(key(c))+'" aria-pressed="'+(key(c)===selected)+'"><div class="case-head"><span class="case-title">'+esc(c.title)+'</span><span class="amount">'+esc(amount(c.amount,c.currency))+'</span></div><div class="case-meta">'+esc(admins[c.division]?.name)+' · '+esc(c.psp)+'</div><div class="case-foot"><span>'+esc(c.reference||c.entry_number||'Referentie ontbreekt')+'</span><span>'+esc(stamp(c.observed_at))+'</span></div><div class="case-foot"><span class="pill '+(c.status==='waiting'?'wait':'')+'">'+esc(labels[c.status])+'</span><span>'+esc(c.workflow?.assigned_name||c.suggested_owner||'Niet toegewezen')+'</span></div>'+(c.stale?'<div class="caption">Oudere brongegevens · controleer actualiteit</div>':'')+'</button>').join('')||'<div class="empty">'+(loading?'Gegevens laden…':'Geen vragen binnen deze selectie. Controleer ook de beschikbaarheid van de bronnen.')+'</div>';
 $('pagination').innerHTML=rows.length>100?'<button class="button" id="prev" '+(page===0?'disabled':'')+'>Vorige</button><span>Pagina '+(page+1)+' van '+Math.ceil(rows.length/100)+'</span><button class="button" id="next" '+((page+1)*100>=rows.length?'disabled':'')+'>Volgende</button>':'';
 if($('prev')){$('prev').onclick=()=>{page--;renderList()};$('next').onclick=()=>{page++;renderList()}}
 document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{selected=b.dataset.case;renderList()});detail();
}
function detail(){
 const c=cases.find(c=>key(c)===selected);if(!c){$('detail').innerHTML='<div class="empty">Selecteer een vraag voor bewijs en vervolgstappen.</div>';return}
 const f=[['Administratie',admins[c.division]?.name+' · '+c.division],['Factuurcategorie',c.question_group_label||'Overige vragen'],['Bronorder',c.reference],['Webshopstatus',c.order_import?.status||'Niet vastgesteld'],['Ordercontrole',c.order_import?.checked_at?stamp(c.order_import.checked_at):'Niet vastgesteld'],['Woo-order',c.woo_order],['Betaaltransactie',c.transaction_id],['Boekingsnummer',c.entry_number],['Debiteur / crediteur',c.debtor],['Bankboek',journalLabel(c)],['Oorspronkelijke betaling',amount(c.amount,c.currency)],['Restbedrag bankpost (Exact, met teken)',amount(c.remaining_amount,c.currency)],['Bijbehorende factuur',c.invoice_number],['Factuurreferentie',c.invoice_reference],['Factuurbedrag',amount(c.invoice_amount,c.currency)],['Restbedrag factuur (Exact, met teken)',amount(c.invoice_remaining,c.currency)],['Verschil volgens bron',amount(c.difference,c.currency)],['Bronmoment',stamp(c.observed_at)]];
 const w=c.workflow||{},draft=drafts[key(c)]||{note:'',decision:''};
 $('detail').innerHTML='<div class="detail-head"><div class="caption">'+esc(c.psp)+' · '+esc(labels[c.status])+'</div><h2>'+esc(c.title)+'</h2><div class="admin-pill">'+esc(admins[c.division]?.name)+'</div></div><div class="detail-body">'+(c.source_changed?'<div class="note">De agentgegevens zijn veranderd sinds het vorige besluit. Beoordeel deze vraag opnieuw.</div>':'')+(c.source_absent?'<div class="note">Deze vraag staat niet in de actuele bronlijst. Het dossier blijft behouden; voltooiing is nog niet bewezen.</div>':'')+'<dl class="facts">'+f.map(([l,v])=>'<div><dt>'+esc(l)+'</dt><dd>'+esc(v??'Niet vastgesteld')+'</dd></div>').join('')+(c.order_import?'<div class="note"><b>Webshop en factuurimport:</b> '+esc(c.order_import.note)+'</div>':'')+'<h3>Waarom vraagt de agent om hulp?</h3><p>'+esc(c.reason)+'</p>'+(c.description?'<div class="evidence">'+esc(c.description)+'</div>':'')+'<h3>Wat is nodig?</h3><p>'+esc(c.needed_information)+'</p><h3>Vervolgstap</h3><p>'+esc(c.next_action)+'</p><div class="evidence">'+(c.evidence||[]).map(e=>'<p><b>'+esc(e.label)+':</b> '+esc(e.value??'Niet vastgesteld')+'</p>').join('')+'</div><div class="note"><b>Uitvoering:</b> '+esc(c.execution_label)+(c.status==='decided'?'<br>Het menselijke besluit staat klaar. Er is vanuit dit dashboard geen financiële uitvoering gestart.':'')+'</div>'+(w.decision?'<p><b>Vastgelegd besluit:</b> '+esc((c.options||[]).find(o=>o.value===w.decision)?.label||w.decision)+'</p>':'')+(w.note?'<p><b>Laatste toelichting:</b> '+esc(w.note)+'</p>':'')+(auth.can_manage_worklist&&c.editable?'<div class="field" style="margin-top:20px"><label for="choice">Vervolgstap vastleggen</label><select id="choice"><option value="">Kies een vervolgstap…</option>'+(c.options||[]).map(o=>'<option value="'+esc(o.value)+'" '+(draft.decision===o.value?'selected':'')+'>'+esc(o.label)+'</option>').join('')+'</select></div><div class="field"><label for="note">Toelichting en aangevulde onderbouwing</label><textarea id="note" maxlength="4000" placeholder="Wat is gecontroleerd en wat moet er gebeuren?">'+esc(draft.note)+'</textarea></div><div class="actions"><button class="button primary" data-action="decide">Besluit vastleggen</button><button class="button" data-action="wait">Wachten op informatie</button><button class="button" data-action="claim">Aan mij toewijzen</button><button class="button" data-action="note">Notitie bewaren</button>'+(c.status!=='open'?'<button class="button" data-action="reopen">Heropenen</button>':'')+'</div><p class="caption">Deze acties bewaren het dossier. Ze voeren geen boeking, aflettering of nieuwe import uit.</p>':c.status==='resolved'?'':'<p class="caption">'+(!auth.can_manage_worklist?'Je hebt leesrechten. Toewijzen en besluiten vastleggen vereist behandelrechten.':'Behandelen is tijdelijk niet beschikbaar; ververs de brongegevens.')+'</p>')+'<details style="margin-top:20px"><summary>Dossiergeschiedenis ('+(w.history||[]).length+' recente gebeurtenissen)</summary>'+(w.history||[]).slice().reverse().map(e=>'<div class="note"><b>'+esc(({claim:'Toegewezen',wait:'Wacht op informatie',reopen:'Heropend',decide:'Besluit vastgelegd',note:'Notitie'}[e.action]||e.action))+'</b> · '+esc(e.actor_name)+'<br><small>'+esc(stamp(e.at))+'</small><p>'+esc(e.note||'')+'</p></div>').join('')+'</details></div>';
 if($('note')){$('note').oninput=()=>{drafts[key(c)]={note:$('note').value,decision:$('choice').value}};$('choice').onchange=$('note').oninput;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>save(c,b.dataset.action))}
}
async function save(c,action){
 const note=$('note').value,decision=$('choice').value;
 if(['wait','decide','note'].includes(action)&&!note.trim()){notify('Vul een toelichting in.');return}
 if(action==='decide'&&!decision){notify('Kies een vervolgstap.');return}
 document.querySelectorAll('[data-action]').forEach(b=>b.disabled=true);
 try{const response=await fetch('/dashboard/api/divisions/'+encodeURIComponent(c.division)+'/worklist/'+c.id,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':auth.csrf},body:JSON.stringify({action,note,decision,revision:c.revision,fingerprint:c.fingerprint})});if(response.status===401){location.replace('/dashboard/login');return}let data={};try{data=await response.json()}catch{}if(!response.ok)throw Error(data.detail||'Opslaan niet gelukt.');delete drafts[key(c)];notify('Dossier opgeslagen. Er is geen financiële uitvoering gestart.');await loadWork()}catch(e){notify(e.message);document.querySelectorAll('[data-action]').forEach(b=>b.disabled=false)}
}
function administrations(){const list=selectedDivisions();$('screen').innerHTML='<h1>Administraties</h1><p class="subtitle">Alleen de administraties waarvoor jouw Microsoft-account toegang heeft.</p><div class="panel table-wrap"><table class="grid-table"><thead><tr><th>Administratie</th><th>Te behandelen</th><th>Wacht op informatie</th><th>Besluit klaar</th><th></th></tr></thead><tbody>'+list.map(id=>'<tr><td>'+esc(admins[id].name)+'<small>'+esc(id)+'</small></td>'+['open','waiting','decided'].map(s=>'<td>'+(results[id]?.connected?cases.filter(c=>c.division===id&&c.status===s).length:'—')+'</td>').join('')+'<td><button class="button" data-admin="'+esc(id)+'">Werklijst openen</button></td></tr>').join('')+'</tbody></table></div>';document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>{$('admin').value=b.dataset.admin;view='work';tab='open';page=0;render();loadWork()})}
function journalsView(){
 const grouped=new Map();
 for(const c of scoped()){const k=journalKey(c);if(!grouped.has(k))grouped.set(k,{label:journalLabel(c),rows:[]});const g=grouped.get(k);g.rows.push(c);if(c.journal_name)g.label=journalLabel(c)}
 $('screen').innerHTML='<h1>Vragen per bankboek</h1><p class="subtitle">Aantallen vragen uit de aangesloten agents. Dit is geen bank- of grootboeksaldo.</p><div class="panel table-wrap"><table class="grid-table"><thead><tr><th>Bankboek</th><th>Te behandelen</th><th>Wacht op informatie</th><th>Besluit klaar</th><th>Ontbrekende inkoopfacturen</th><th></th></tr></thead><tbody>'+[...grouped.entries()].sort((a,b)=>a[1].label.localeCompare(b[1].label)).map(([k,g])=>'<tr><td>'+esc(g.label)+'</td>'+['open','waiting','decided'].map(status=>'<td>'+g.rows.filter(c=>c.status===status).length+'</td>').join('')+'<td>'+g.rows.filter(c=>c.question_group==='purchase_missing'&&c.status!=='resolved').length+'</td><td><button class="button" data-journal="'+esc(k)+'">Vragen bekijken</button></td></tr>').join('')+'</tbody></table></div>'+(!grouped.size?'<p>Geen vragen beschikbaar. Controleer de aangesloten bronnen.</p>':'');
 document.querySelectorAll('[data-journal]').forEach(b=>b.onclick=()=>{journal=b.dataset.journal;group='all';kind='all';psp='all';search='';tab='open';page=0;view='work';render()});
}
function workerPanel(){return selectedDivisions().map(id=>{const data=results[id]?.agents;const heading='<h2>'+esc(admins[id].name)+'</h2>';if(!data?.available)return heading+'<p>Workerstatus niet beschikbaar. Dit bewijst niet dat de verwerking stil staat.</p>';if(!data.roles?.length)return heading+'<p>Nog geen afzonderlijk taakbezit geregistreerd.</p>';return heading+data.roles.map(r=>{const places={web:'Bestaande webservice',worker:'Afzonderlijke worker'};const state=r.unresolved_writes>0?'Beoordeling nodig: onzekere schrijfpoging':r.draining?'Overdracht / pauze aangevraagd':!r.lease_live?'Geen actuele heartbeat':'Actief taakbezit';return '<div class="note"><b>'+esc(({routing:'Debiteurenroutering','woo-rules':'Woo-bankregels'})[r.role]||r.role)+'</b> · '+esc(state)+'<br>Huidige uitvoering: '+esc(places[r.execution_location]||'Niet vastgesteld')+' · Gewenst: '+esc(places[r.desired_location]||(r.draining?'Gepauzeerd':'Niet vastgesteld'))+'<br>Laatste heartbeat: '+esc(stamp(r.heartbeat_at))+' · Open schrijfpogingen: '+esc(r.unresolved_writes??'onbekend')+'</div>'}).join('')}).join('')}
function workers(){$('screen').innerHTML='<h1>Bronnen en verwerking</h1><p class="subtitle">Laatst opgeslagen agentgegevens. Verversen leest deze dossiers en start geen verwerking.</p><div class="panel" style="padding:20px">'+sourcePanel()+workerPanel()+'</div><div class="note">Een aangesloten bron kan oudere gegevens bevatten. Controleer het bronmoment voordat je een inhoudelijk besluit neemt. Financiële uitvoering vanuit deze werklijst is nog niet aangesloten.</div>'}
function design(){$('screen').innerHTML='<h1>Groeien naar meer administraties</h1><p class="subtitle">JNP is de eerste aangesloten administratie.</p><div class="panel plan"><h2>Per administratie gescheiden</h2><p>Toegang wordt op de server gecontroleerd. Elke nieuwe administratie krijgt haar eigen bronkoppelingen, instellingen en dossiers.</p><h2>Van vraag naar afhandeling</h2><ol><li>De agent bewaart de uitzondering met bronbewijs.</li><li>Een behandelaar legt een vervolgstap en toelichting vast.</li><li>Het besluit en de uitvoering blijven afzonderlijk zichtbaar.</li><li>Een vraag is pas bevestigd afgehandeld als de agent het resultaat heeft teruggelezen.</li></ol><p class="muted">Afzonderlijke PSP-workerpools en financiële uitvoering van dashboardbesluiten zijn vervolgstappen. Deze pagina beheert ze nog niet.</p></div>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});({work,admins:administrations,journals:journalsView,workers,design})[view]()}
async function loadWork(){
 const number=++requestNumber;loading=true;const ids=selectedDivisions();if(view==='work')work();
 for(let offset=0;offset<ids.length;offset+=4){await Promise.all(ids.slice(offset,offset+4).map(async id=>{try{const response=await fetch('/dashboard/api/divisions/'+encodeURIComponent(id)+'/worklist',{credentials:'same-origin',cache:'no-store'});if(response.status===401){location.replace('/dashboard/login');return}if(!response.ok)throw Error();const result=await response.json();if(number===requestNumber)results[id]=result}catch{if(number===requestNumber)results[id]={load_error:true,connected:false,items:[],sources:[]}}}))}
 if(number!==requestNumber)return;loading=false;cases=Object.entries(results).flatMap(([division,r])=>(r.items||[]).map(c=>({...c,division})));render();
}
async function bootstrap(){try{const response=await fetch('/dashboard/api/me',{credentials:'same-origin',cache:'no-store'});if(response.status===401){location.replace('/dashboard/login');return}if(!response.ok)throw Error();auth=await response.json();$('signed-in').textContent=auth.name+' · '+({viewer:'Lezen',operator:'Behandelen',admin:'Beheer'}[auth.role]||auth.role);for(const [id,name] of Object.entries(auth.divisions)){admins[id]={name};const option=document.createElement('option');option.value=id;option.textContent=name+' · '+id;$('admin').appendChild(option)}render();await loadWork();setInterval(()=>{if(!loading&&document.visibilityState==='visible'&&!Object.values(drafts).some(d=>d.note||d.decision))loadWork()},60000)}catch{$('screen').innerHTML='<h1>Dashboard niet beschikbaar</h1><p>Je toegang kon niet worden gecontroleerd. Meld je opnieuw aan.</p>'}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('admin').onchange=()=>{selected=null;journal='all';page=0;render();loadWork()};
$('logout').onclick=async()=>{if(!auth)return;try{const r=await fetch('/dashboard/auth/logout',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':auth.csrf}});if(r.ok)location.replace('/dashboard/login');else notify('Uitloggen is niet gelukt.')}catch{notify('Uitloggen is niet gelukt.')}};
bootstrap();
})();
</script>
</body>
