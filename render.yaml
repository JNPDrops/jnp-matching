services:
  - type: web
    name: jnp-matching
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: EXACT_DIVISION
        value: "3977752"
      - key: EXACT_BASE_URL
        value: "https://start.exactonline.nl"
      - key: SUSPENSE_GL_CODE
        value: "1360"
      - key: COLLECTIVE_DEBTOR_CODE
        value: "100100"
      - key: ORDER_REF_PREFIX
        value: "TD"
      - key: TOKEN_STORE_PATH
        value: "/data/exact_tokens.json"
      - key: EXACT_CLIENT_ID
        sync: false
      - key: EXACT_CLIENT_SECRET
        sync: false
      - key: EXACT_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: exact-token-store
      mountPath: /data
      sizeGB: 1
